[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repair-ops-ai-governance-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "langgraph==0.4.8",
    "langsmith==0.16.2",
    "pydantic==2.11.7",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]
bedrock = ["boto3==1.38.41"]
mcp = ["mcp==1.12.4"]

[tool.setuptools.packages.find]
include = ["repair_ops*"]
