name: Offline checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e '.[test,bedrock,mcp]'
      - run: python -m pytest -q
      - run: python -m repair_ops.cli eval
